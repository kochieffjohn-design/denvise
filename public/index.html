<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover — рисуем под вырезом («чёлкой»): отступы от него
      считает react-native-safe-area-context через env(safe-area-inset-*),
      см. hooks/useSafeLayout.ts. Масштабирование жестом не запрещаем
      (доступность); автоувеличение при фокусе убрано шрифтом полей 16px.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!--
      Установка как приложение (PWA). Иконки и сплэши генерирует
      scripts/generate-icons.js (npm run icons) из assets/brand/logo-1080.png.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Цвет системных полос Android и переключателя приложений = верх шапки (C.navyDeep) -->
    <meta name="theme-color" content="#141a30" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Denvise" />
    <!--
      Строка с часами на iPhone прозрачная, тёмная шапка уходит под неё.
      Отступ от выреза считает hooks/useSafeLayout.ts.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      /*
        iOS, установленное приложение + black-translucent: страница начинается
        под строкой с часами, но её высота считается как «экран минус эта
        строка», и снизу остаётся пустая полоса (просвечивает фон html).
        Растягиваем html на полную высоту экрана. navigator.standalone есть
        только в iOS, поэтому в Safari, на Android и десктопе это не работает.

        Растягиваем всегда, а не «если innerHeight меньше экрана»: при запуске
        iOS может сначала сообщить полную высоту и укоротить страницу позже,
        не присылая resize, — тогда проверка промахивалась и полоса оставалась.
        Установленное приложение на iPhone всегда занимает весь экран, так что
        при правильной высоте от iOS это ничего не меняет.
      */
      (function () {
        if (window.navigator.standalone !== true) return;
        var root = document.documentElement;
        function fit() {
          // screen.width/height на iOS не меняются при повороте — берём по ориентации
          var landscape = window.matchMedia('(orientation: landscape)').matches;
          root.style.height = (landscape ? window.screen.width : window.screen.height) + 'px';
          root.style.overflow = 'hidden'; // лишние пиксели не должны прокручиваться
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
        window.addEventListener('pageshow', fit);
        document.addEventListener('visibilitychange', fit);
      })();
    </script>
    <!-- splash:start — блок генерирует scripts/generate-icons.js, не править руками -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- splash:end -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Поведение как у приложения, а не у сайта -->
    <style id="denvise-app-shell">
      html,
      body {
        /* Страница целиком не «пружинит» и не тянет pull-to-refresh */
        overscroll-behavior: none;
        background-color: #eef2f7; /* C.bg */
        /* Не увеличивать шрифт при повороте экрана на iOS */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        /* Текст интерфейса не выделяется долгим нажатием */
        -webkit-user-select: none;
        user-select: none;
        /* Нет меню «Скопировать/Поделиться» при долгом нажатии на iOS */
        -webkit-touch-callout: none;
        /* Нет серой вспышки при касании — отклик рисуют сами кнопки */
        -webkit-tap-highlight-color: transparent;
      }
      /* В полях ввода выделение и меню нужны */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      /*
        Десктоп и планшет: приложение — колонка шириной с телефон по центру
        на фирменном фоне. Экраны меряют ширину контейнера, а не окна
        (см. онбординг), поэтому внутри колонки всё выглядит как на телефоне.
      */
      @media (min-width: 520px) {
        html,
        body {
          background-color: #141a30; /* C.navyDeep */
          background-image:
            radial-gradient(circle at 20% 15%, rgba(59, 130, 246, 0.28), transparent 45%),
            radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.18), transparent 40%),
            linear-gradient(180deg, #141a30 0%, #1a2340 100%); /* C.navyDeep → C.dark */
        }
        #root {
          width: 100%;
          max-width: 480px;
          margin: 0 auto;
          background-color: #eef2f7; /* C.bg */
          box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 24px 80px rgba(0, 0, 0, 0.45);
          overflow: hidden;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      Для работы Denvise включите JavaScript.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
